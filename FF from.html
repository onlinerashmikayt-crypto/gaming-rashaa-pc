<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire • Application</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:#fff;font-family:'Inter',sans-serif}
.header{background:#FFC200;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:sticky;top:0;z-index:10}
.logo{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;color:#fff;text-shadow:2px 3px 0 #000}
.wrap{max-width:800px;margin:20px auto;padding:15px}
.card{background:#121212;border:1px solid #2a2a2a;border-radius:18px;padding:22px}
label{color:#FFC200;font-size:12px;font-weight:700;margin-bottom:5px;display:block;margin-top:12px}
.inp{width:100%;background:#232323;border:1px solid #3a3a3a;border-radius:10px;padding:11px 12px;color:#fff}
.btn{width:100%;background:#FFC200;color:#000;border:none;padding:16px;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer;margin-top:20px}
.btn:disabled{background:#555}
</style>
</head>
<body>
<div class="header"><div class="logo">FREE FIRE</div><a href="inbox.html" style="background:#000;color:#FFC200;padding:6px 16px;border-radius:20px;text-decoration:none;font-weight:900;font-size:12px">MY INBOX</a></div>
<div class="wrap">
<form class="card" id="ffForm" action="https://formsubmit.co/rashmika19941030@gmail.com" method="POST">
<h2 style="color:#FFC200;text-align:center">🏆 TOURNAMENT APPLICATION</h2>

<!-- FormSubmit Settings - Private Save -->
<input type="hidden" name="_subject" value="🔥 NEW FF TOURNAMENT APPLICATION!">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="https://onlinerashmikayt-crypto.github.io/ga/thankyou.html">

<label>Team Name</label><input class="inp" name="Team Name" required>
<label>Team Tag</label><input class="inp" name="Team Tag" required>
<label>Region</label><select class="inp" name="Region" required><option value="">Select</option><option>SG - Sri Lanka</option><option>Middle East</option></select>
<label>Captain Name</label><input class="inp" name="Captain Name" required>
<label>Captain UID</label><input class="inp" name="Captain UID" required>
<label>Captain Phone</label><input class="inp" name="Captain Phone" required>
<label>Captain Email</label><input class="inp" name="Captain Email" type="email" required>
<label>Player 2 UID</label><input class="inp" name="Player 2 UID" required>
<label>Player 3 UID</label><input class="inp" name="Player 3 UID" required>
<label>Player 4 UID</label><input class="inp" name="Player 4 UID" required>

<button class="btn" id="submitBtn" type="submit">SUBMIT APPLICATION →</button>
<p style="font-size:10px;color:#888;text-align:center;margin-top:10px">Private - Only owner can see in Email</p>
</form>
</div>

<script>
// Local backup එකටත් save වෙනවා (ඔයාට විතරක් inbox eke penna)
document.getElementById('ffForm').addEventListener('submit', function(){
 const d = new FormData(this);
 const newApp = {
  team: d.get('Team Name')+' '+d.get('Team Tag'),
  capName: d.get('Captain Name'),
  phone: d.get('Captain Phone'),
  email: d.get('Captain Email'),
  time: new Date().toLocaleString()
 };
 let oldApps = JSON.parse(localStorage.getItem('my_inbox') || '[]');
 oldApps.push(newApp);
 localStorage.setItem('my_inbox', JSON.stringify(oldApps));
 document.getElementById('submitBtn').innerText = "SENDING...";
});
</script>
</body>
</html>
