<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gaming Rash - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 35px 30px;
      background: #111;
      border: 1px solid red;
      border-radius: 18px;
      box-shadow: 0 0 30px #550000;
      text-align: center;
    }

    h1 {
      color: #ff2020;
      margin-bottom: 8px;
      text-shadow: 0 0 15px red;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      background: #050505;
      color: white;
      border: 1px solid #ff0000;
      border-radius: 9px;
      outline: none;
    }

    input:focus {
      box-shadow: 0 0 10px red;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 9px;
      background: red;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px red;
    }

    button:hover {
      background: white;
      color: red;
    }

    #message {
      margin-top: 15px;
      min-height: 20px;
    }

    .register-link {
      display: block;
      margin-top: 20px;
      color: #ff3030;
      text-decoration: none;
    }

    .register-link:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🎮 Gaming Rash</h1>

    <p class="subtitle">Welcome Back 🔥</p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email"
        required>

      <input
        type="password"
        id="password"
        placeholder="Password"
        required>

      <button type="submit">
        🔐 LOGIN
      </button>

    </form>

    <p id="message"></p>

    <a class="register-link" href="register.html">
      Don't have an account? 📝 Register
    </a>

  </div>


  <script type="module">

    import {
      auth,
      signInWithEmailAndPassword
    } from "./firebase.js";


    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async (e) => {

      e.preventDefault();


      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      try {

        message.textContent =
          "⏳ Logging in...";

        message.style.color = "orange";


        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        message.textContent =
          "✅ Login successful!";

        message.style.color = "lime";


        setTimeout(() => {

          window.location.href =
            "profile.html";

        }, 800);


      } catch (error) {

        console.error(error);


        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {

          message.textContent =
            "❌ Email හෝ Password වැරදියි.";

        } else {

          message.textContent =
            "❌ Login failed: " +
            error.message;

        }

        message.style.color = "red";
      }

    });

  </script>

</body>
</html>
