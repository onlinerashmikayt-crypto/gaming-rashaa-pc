<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE FIRE FORM</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;display:flex;justify-content:center}
.page{max-width:850px;width:100%;background:#161616;border:2px solid #FFC200}
.hdr{background:#FFC200;padding:15px;text-align:center;color:#000;font-size:40px;font-weight:900}
.body{padding:20px}
.inp{width:100%;background:#333;border:1px solid #FFC200;border-radius:20px;padding:10px;margin:8px 0;color:#fff}
.btn{width:100%;background:#FFC200;color:#000;padding:15px;font-size:22px;font-weight:900;border:none;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<div class="page">
<div class="hdr">FREE FIRE</div>
<div class="body">
<h2 style="color:#FFC200;text-align:center">TOURNAMENT - APPLICATION FORM</h2>
<form id="ffForm">
<input class="inp" name="teamName" placeholder="Team Name" required>
<input class="inp" name="teamLevel" placeholder="Team Level - Diamond/Heroic">
<input class="inp" name="captainName" placeholder="Captain Name" required>
<input class="inp" name="whatsapp" placeholder="Captain WhatsApp" required>
<input class="inp" name="p1" placeholder="Player 1 UID" required>
<input class="inp" name="p2" placeholder="Player 2 UID" required>
<input class="inp" name="p3" placeholder="Player 3 UID" required>
<input class="inp" name="p4" placeholder="Player 4 UID" required>
<input class="inp" name="sub" placeholder="Substitute UID (Optional)">
<button class="btn" type="submit">SUBMIT TO WHATSAPP 🔥</button>
</form>
</div>
</div>
<script>
document.getElementById('ffForm').addEventListener('submit', function(e){
 e.preventDefault();
 const data = new FormData(e.target);
 // MEKA OYAGE NUMBER EKA - +94 NATHUWA 94 DALA DANNA
 const myNumber = "940771527142"; // Ex: 94712345678

 let message = `*FREE FIRE TOURNAMENT - NEW APPLICATION* 🔥%0A%0A`;
 message += `*Team Name:* ${data.get('teamName')}%0A`;
 message += `*Team Level:* ${data.get('teamLevel')}%0A`;
 message += `*Captain:* ${data.get('captainName')}%0A`;
 message += `*Captain WhatsApp:* ${data.get('whatsapp')}%0A%0A`;
 message += `*Player 1 UID:* ${data.get('p1')}%0A`;
 message += `*Player 2 UID:* ${data.get('p2')}%0A`;
 message += `*Player 3 UID:* ${data.get('p3')}%0A`;
 message += `*Player 4 UID:* ${data.get('p4')}%0A`;
 message += `*Sub UID:* ${data.get('sub')}%0A`;

 const url = `https://wa.me/${myNumber}?text=${message}`;
 window.open(url, '_blank');
});
</script>
</body>
</html>
